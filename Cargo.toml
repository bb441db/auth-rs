[package]
name = "auth-rs"
version = "0.1.0"
edition = "2021"

[dependencies]
clap = { version = "4.5.42", features = ["derive"] }
console = "0.16.0"
exec = "0.3.1"
keyring-core = "1.0.0"
log = "0.4"
env_logger = { version = "0.11.8", default-features = false, features = ["auto-color", "humantime"] }
opener = "0.8.5"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.142"
thiserror = "2.0.12"
ureq = { version = "3", default-features = false, features = ["rustls-no-provider", "platform-verifier", "json"] }
url = "2.5.4"
uuid = { version = "1.17.0", features = ["v4"] }
dirs = "6.0.0"

[target.'cfg(target_os = "linux")'.dependencies]
linux-keyutils-keyring-store = "1.0.0"

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = "1.0.2"

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = "1.1.0"

[profile.release]
lto = true
codegen-units = 1
panic = 'abort'
strip = true
opt-level = "z"
